# The L1 contracts for op-cartesi: the bridge between OP proposals and Cartesi
# output execution, plus Cartesi-style portals that route deposits through
# OptimismPortal instead of an InputBox.
[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
# Cartesi's contracts are ^0.8.22 and use transient-storage-free code, so the
# default EVM version is fine; pinning it keeps deployed bytecode stable across
# solc bumps.
evm_version = "cancun"

# The suite reads the shared conformance vectors (../conformance, generated by
# `go test ./chain -run TestConformance -update`) instead of carrying its own
# copies of the node's roots, hashes and proofs. Read-only, and only that
# directory.
fs_permissions = [{ access = "read", path = "../conformance" }]

# External code comes from soldeer rather than git submodules. `forge soldeer
# install` reads this section.
[dependencies]
"@openzeppelin-contracts" = "5.2.0"
cartesi-rollups-contracts = "3.0.0-alpha.6"
# A transitive dependency of the above, and the only one that is not a registry
# package: CanonicalMachine takes its constants from the emulator's own Solidity
# port. Declared here because soldeer does not resolve a dependency's
# dependencies.
cartesi-machine-solidity-step = { version = "0.13.0", git = "https://github.com/cartesi/machine-solidity-step.git", tag = "v0.13.0" }
forge-std = "1.9.6"

[soldeer]
# Keep dependencies out of the repository; they are reproducible from the
# versions above.
remappings_generate = false
