<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img">
<title>Three value paths. A deposit travels from deposit.ts — or from deposit-erc20.ts through L1StandardBridge — into the OptimismPortal, is derived by op-node into an L2 deposit transaction, reaches the machine as an EvmAdvance input, and is credited to the routed guest's accounts drive. A withdrawal leaves from withdraw.ts through the L2ToL1MessagePasser predeploy — or from withdraw-erc20.ts through the L2StandardBridge and messenger — into the block's withdrawal trie, which is the header's withdrawalsRoot, is proposed by op-proposer as a dispute game, and is proven and finalized on the OptimismPortal, which pays from the ether lockbox or lets L1StandardBridge release its escrow. An application's own voucher enters the outputs tree, whose root sits at a reserved slot of the same withdrawal trie, and after a proposal the outputs validator opens the root claim so execute-voucher.ts can run the voucher through OutputExecutor.</title>
<style>
  .b     { fill: #ffffff; stroke: #9fada5; stroke-width: 1.2; }
  .b-acc { fill: #ffffff; stroke: #0b7a63; stroke-width: 1.6; }
  .ts  { fill: #212824; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; font-weight: 600; }
  .m   { fill: #5d6a63; font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace; font-size: 10.5px; }
  .lane { fill: #0b7a63; font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace; font-size: 10.5px; letter-spacing: 0.12em; }
  .edge { stroke: #414d46; stroke-width: 1.3; fill: none; }
  .arrowhead { fill: #414d46; }
</style>
<defs>
  <marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/>
  </marker>
</defs>

<rect width="1000" height="420" fill="#f2f5f2"/>

<!-- deposits -->
<text class="lane" x="24" y="30">DEPOSIT — L1 → L2 · stock OP contracts</text>

<rect class="b-acc" x="24" y="42" width="170" height="46" rx="7"/>
<text class="ts" x="36" y="61">deposit.ts</text>
<text class="m" x="36" y="78">depositTransaction</text>

<rect class="b-acc" x="24" y="98" width="170" height="46" rx="7"/>
<text class="ts" x="36" y="117">deposit-erc20.ts</text>
<text class="m" x="36" y="134">L1StandardBridge</text>

<rect class="b" x="218" y="42" width="170" height="46" rx="7"/>
<text class="ts" x="230" y="61">OptimismPortal · L1</text>
<text class="m" x="230" y="78">TransactionDeposited</text>

<rect class="b" x="412" y="42" width="170" height="46" rx="7"/>
<text class="ts" x="424" y="61">op-node</text>
<text class="m" x="424" y="78">derives deposit tx</text>

<rect class="b-acc" x="606" y="42" width="170" height="46" rx="7"/>
<text class="ts" x="618" y="61">shim → machine</text>
<text class="m" x="618" y="78">EvmAdvance input</text>

<rect class="b-acc" x="800" y="42" width="170" height="46" rx="7"/>
<text class="ts" x="812" y="61">routed guest</text>
<text class="m" x="812" y="78">credits accounts drive</text>

<path class="edge" d="M 198 65 L 214 65" marker-end="url(#ah2)"/>
<path class="edge" d="M 392 65 L 408 65" marker-end="url(#ah2)"/>
<path class="edge" d="M 586 65 L 602 65" marker-end="url(#ah2)"/>
<path class="edge" d="M 780 65 L 796 65" marker-end="url(#ah2)"/>
<path class="edge" d="M 198 121 L 303 121 L 303 92" marker-end="url(#ah2)"/>

<!-- withdrawals -->
<text class="lane" x="24" y="186">WITHDRAWAL — L2 → L1 · OP messages</text>

<rect class="b-acc" x="24" y="198" width="170" height="46" rx="7"/>
<text class="ts" x="36" y="217">withdraw.ts</text>
<text class="m" x="36" y="234">L2ToL1MessagePasser</text>

<rect class="b-acc" x="24" y="254" width="170" height="46" rx="7"/>
<text class="ts" x="36" y="273">withdraw-erc20.ts</text>
<text class="m" x="36" y="290">bridge → messenger</text>

<rect class="b-acc" x="218" y="198" width="170" height="46" rx="7"/>
<text class="ts" x="230" y="217">withdrawal trie</text>
<text class="m" x="230" y="234">header withdrawalsRoot</text>

<rect class="b" x="412" y="198" width="170" height="46" rx="7"/>
<text class="ts" x="424" y="217">op-proposer</text>
<text class="m" x="424" y="234">output root → game</text>

<rect class="b" x="606" y="198" width="170" height="46" rx="7"/>
<text class="ts" x="618" y="217">OptimismPortal · L1</text>
<text class="m" x="618" y="234">prove · finalize</text>

<rect class="b" x="800" y="198" width="170" height="46" rx="7"/>
<text class="ts" x="812" y="217">L1 payout</text>
<text class="m" x="812" y="234">lockbox · bridge escrow</text>

<path class="edge" d="M 198 221 L 214 221" marker-end="url(#ah2)"/>
<path class="edge" d="M 392 221 L 408 221" marker-end="url(#ah2)"/>
<path class="edge" d="M 586 221 L 602 221" marker-end="url(#ah2)"/>
<path class="edge" d="M 780 221 L 796 221" marker-end="url(#ah2)"/>
<path class="edge" d="M 198 277 L 303 277 L 303 248" marker-end="url(#ah2)"/>

<!-- cartesi outputs -->
<text class="lane" x="24" y="342">CARTESI OUTPUT — an application's own voucher</text>

<rect class="b-acc" x="24" y="354" width="170" height="46" rx="7"/>
<text class="ts" x="36" y="373">guest voucher</text>
<text class="m" x="36" y="390">leaf in outputs tree</text>

<rect class="b-acc" x="218" y="354" width="170" height="46" rx="7"/>
<text class="ts" x="230" y="373">withdrawal trie</text>
<text class="m" x="230" y="390">outputs root at a slot</text>

<rect class="b" x="412" y="354" width="170" height="46" rx="7"/>
<text class="ts" x="424" y="373">op-proposer</text>
<text class="m" x="424" y="390">root claim → game</text>

<rect class="b-acc" x="606" y="354" width="170" height="46" rx="7"/>
<text class="ts" x="618" y="373">outputs validator</text>
<text class="m" x="618" y="390">opens the root claim</text>

<rect class="b-acc" x="800" y="354" width="170" height="46" rx="7"/>
<text class="ts" x="812" y="373">execute-voucher.ts</text>
<text class="m" x="812" y="390">proof → OutputExecutor</text>

<path class="edge" d="M 198 377 L 214 377" marker-end="url(#ah2)"/>
<path class="edge" d="M 392 377 L 408 377" marker-end="url(#ah2)"/>
<path class="edge" d="M 586 377 L 602 377" marker-end="url(#ah2)"/>
<path class="edge" d="M 780 377 L 796 377" marker-end="url(#ah2)"/>
</svg>
