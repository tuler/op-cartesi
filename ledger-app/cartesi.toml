# Machine configuration for `cartesi build` (@cartesi/cli 2.0 alpha).
#
# The root drive builds from this directory's Dockerfile with the REPO ROOT
# as its docker context: the app is a bun workspace member, and its
# @cartesi/accounts dependency lives in ../accounts-drive/js — outside this
# directory, inside the context. (docker resolves --file against the CLI's
# working directory, so the dockerfile path stays the default.)
#
# The accounts drive (docs/ACCOUNTS-DRIVE-SPEC.md) and the abi drive
# (docs/ABI-DRIVE-SPEC.md) are raw, zero-filled, never mounted — the guest
# formats both at boot, before the first yield, so their headers land inside
# the stored snapshot and the genesis state root covers them. Sizes are
# powers of two, so each drive is a single aligned subtree of the machine's
# hash tree.
#
# Note the CLI auto-places drives (no `start:` control), unlike
# devnet/build-snapshot.sh which pins the spec's recommended 2^55. The shim
# discovers the drive by its label via the machine config (ACCOUNTS.md §5.1),
# so auto-placement works; pinning the start in the CLI is a wanted upstream
# knob.
#
# `user` hands the raw device node to the entrypoint's user: cartesi-init
# runs the app unprivileged (dapp), and an unmounted pmem device is
# otherwise root-only — the app's direct open would die with EACCES.

[drives.accounts]
builder = "empty"
format = "raw"
size = 1048576
mount = false
user = "dapp"

[drives.abi]
builder = "empty"
format = "raw"
size = 262144
mount = false
user = "dapp"

[drives.root]
builder = "docker"
context = ".."

# machine-emulator 0.21.0 needs a matching kernel, and the CLI's bundled sdk
# does not carry one yet, so point ram_image at a locally installed
# compatible linux.bin. This is the macOS homebrew location; on linux the
# emulator's images usually live at /usr/share/cartesi-machine/images/.
[machine]
ram_image = "/opt/homebrew/etc/cartesi/images/linux.bin"
