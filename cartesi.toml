# The machine this chain runs on: `cartesi build`, here at the repo root.
# What the drives are and why, in demo/README.md.

[drives.accounts]
builder = "empty"
format = "raw"
size = 1048576
mount = false
user = "dapp"

[drives.abi]
builder = "empty"
format = "raw"
size = 262144
mount = false
user = "dapp"

# Defaults otherwise: the docker builder, with the repo root as its context.
[drives.root]
dockerfile = "demo/Dockerfile"

# machine-emulator 0.21.0 needs a matching kernel and the CLI's sdk carries
# none yet. This is the macOS homebrew location; on linux the emulator's own
# images usually live in /usr/share/cartesi-machine/images/.
[machine]
ram_image = "/opt/homebrew/etc/cartesi/images/linux.bin"
